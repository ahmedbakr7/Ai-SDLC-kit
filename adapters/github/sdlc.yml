# Product CI: the same gate agents run locally, enforced on every PR.
# Installed by `sdlc init` as .github/workflows/sdlc.yml. Mark the "gate" job required
# in branch protection. Add the services/setup your stack needs (databases, browsers).
name: sdlc

on:
  pull_request:
  push:
    branches: [main]
  # Approvals arrive after CI ran: the approval job re-runs on reviews and comments alone.
  pull_request_review:
  issue_comment:
    types: [created, edited]

jobs:
  gate:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0          # the gate diffs against the base branch
          # A private kit repo cannot be cloned with github.token (it reads this repo only).
          # Add a SDLC_KIT_TOKEN secret: fine-grained token, Contents read on this repo and the kit.
          token: ${{ secrets.SDLC_KIT_TOKEN || github.token }}
          persist-credentials: false   # keep the token out of .git/config for later steps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stack setup goes here, e.g. for Node:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22, cache: npm }
      # - run: npm ci

      - name: Doctor (fails if any required check could pass vacuously)
        run: .sdlc/bin/sdlc doctor

      - name: Gate (ci)
        run: .sdlc/bin/sdlc gate ci --base origin/${{ github.base_ref || 'main' }}

      - name: Trace (requirements -> tickets -> proven AC)
        if: ${{ !cancelled() }}   # still report the trace when gate ci is red
        run: .sdlc/bin/sdlc trace

      # Every PR is a ticket PR or a lead PR. `gate pr` finds the one ticket the branch moves
      # (its ticket, evidence or review file changed; status in_progress or later) and judges
      # the whole branch: every changed file is in one of that ticket's write sets, status
      # moved legally, and a done ticket has an approval that covers what is merged. A branch
      # that moves no ticket is a lead PR: files beyond lead artifacts (specs, plans,
      # CONTRACTS, tickets, ADRs, sdlc.toml, scope.lead_allowed) are reported, and fail
      # only with scope.lead_code = "fail".
      - name: PR gate (the ticket this PR moves, or lead scope)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: .sdlc/bin/sdlc gate pr --base origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdlc-run
          path: .sdlc-run/
          include-hidden-files: true   # v4 skips dot-folders by default: the evidence was never uploaded

  # [approval] mode = forge | git (ADR-0001): an approval bound to the PR's own diff covers the
  # head for every role its lane needs. Mark "approval" required too. It never re-runs the tests.
  # Review and comment events run with this repository's secrets, so the kit that judges runs
  # from the base branch's checkout; the PR head is only read, from a separate worktree.
  approval:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.SDLC_KIT_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR head as data (a worktree; nothing from it runs)
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" fetch origin "pull/$PR/head:pr-head"
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" fetch origin "refs/notes/sdlc:refs/notes/sdlc" || true
          git worktree add ../pr-head pr-head
      - name: Approval (covers the head, from the right identities)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .sdlc/bin/sdlc --root ../pr-head approval --base origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
