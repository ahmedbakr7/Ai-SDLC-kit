# Product PR checks — copy into the product as:
#   mkdir -p .github/workflows
#   cp .sdlc/adapters/github/product-pr-checks.yml .github/workflows/product-pr-checks.yml
#
# Required merge gate (with /review Approve): lint + typecheck + unit.
# Integration is optional — enable the job (and mark it required) when present.
#
# Who runs what:
#   /build   — lint, typecheck, unit locally; green before opening the PR
#   CI       — same checks on every pull_request (this workflow)
#   /test    — integration/e2e on the build PR when invited (not a post-merge PR)
#   /review  — AC↔proof; Approve only when required checks are green
#   lead     — merges only when required checks green + review Approve
#
# Adapt the shell bodies to your stack (npm shown; swap for make/pytest/go/…).

name: product-pr-checks

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: lint
        run: |
          # Placeholder: npm run lint | make lint | ruff check . | golangci-lint run
          npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: typecheck
        run: |
          # Placeholder: npm run typecheck | npx tsc --noEmit | mypy . | go build ./...
          npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: unit
        run: |
          # Prefer kit runner when pinned; else npm test / make test / pytest
          if [ -x .sdlc/scripts/run-tests.sh ]; then .sdlc/scripts/run-tests.sh
          elif [ -x scripts/run-tests.sh ]; then scripts/run-tests.sh
          else npm test
          fi

  # Optional: uncomment (or keep) when the product has an integration/e2e target.
  # Mark required in branch protection only after the target exists.
  # integration:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         submodules: true
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #         cache: npm
  #     - run: |
  #         if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
  #     - name: integration
  #       run: |
  #         # Placeholder: npm run test:integration | make test-integration | .sdlc/scripts/run-app-eval.sh
  #         npm run test:integration
