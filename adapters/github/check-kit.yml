name: check-kit

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chmod scripts
        run: chmod +x scripts/*.sh
      - name: check-kit
        run: ./scripts/check-kit.sh
      - name: verify example tickets
        run: |
          ./scripts/verify-ticket.sh T-042-01
          ./scripts/verify-ticket.sh T-042-02
          ./scripts/verify-ticket.sh T-042-03
          ./scripts/verify-ticket.sh T-042-04
