# Product CI for [approval] mode = forge (ADR-0001): does an approval bound to the PR's own diff
# cover the head for every role its lane needs? Installed by `sdlc init` as
# .github/workflows/sdlc-approval.yml. Mark the "sdlc/approval" commit status required.
#
# Its own workflow, so a review event never skips (and so passes) the gate job. On
# pull_request_target and comment events GitHub runs this file from the base (default) branch;
# on pull_request_review events it runs the PR's copy, which a same-repository PR can edit (see
# CONSUME.md: a status from Actions proves nothing against write access). As written, the
# checkout and the kit come from the base branch and the PR head is fetched into a separate
# worktree and only read; nothing from it runs.
name: sdlc-approval

on:
  pull_request_target:
    # edited: a retargeted PR is judged again with the new base branch's config and roles.
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
  issue_comment:
    types: [created, edited, deleted]

jobs:
  approval:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write          # the result is posted as the sdlc/approval status on the PR head
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          token: ${{ secrets.SDLC_KIT_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR head as data (a worktree; nothing from it runs)
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        # Git over HTTPS takes the token as basic auth (x-access-token), as actions/checkout does.
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$AUTH" fetch origin "pull/$PR/head:pr-head"
          git -c "http.extraheader=$AUTH" fetch origin "refs/notes/sdlc:refs/notes/sdlc" || true
          git worktree add ../pr-head pr-head
      - name: Approval (covers the head, from the right identities)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
        # A comment event names no base branch: ask the GitHub API, never the PR's own files.
        run: |
          if [ -z "$BASE" ]; then
            BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          fi
          [ -n "$BASE" ] || { echo "sdlc-approval: cannot resolve the base branch of PR $PR"; exit 1; }
          .sdlc/bin/sdlc --root ../pr-head approval --pr "$PR" --base "origin/$BASE" --publish-status
