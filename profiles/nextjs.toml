# Next.js (App Router) + TypeScript + Vitest (+ optional Playwright).
# Product sdlc.toml overrides any key. {junit} is filled in by the gate.

[commands]
lint = "npx --no-install eslint . --max-warnings 0"
typecheck = "npx --no-install tsc --noEmit -p tsconfig.json"
unit = "npx --no-install vitest run --reporter=default --reporter=junit --outputFile.junit={junit}"
build = "npx --no-install next build"
start = "npx --no-install next start -p {port}"
# Production code only: test setup repeats by design and drowned the signal (68% of clones in
# the Hangout pilot). Exit status follows --threshold (no --exitCode: that fails on any clone).
# An existing codebase starts --threshold at today's level and lowers it.
duplication = "npx --no-install jscpd --min-lines 12 --threshold 2 --gitignore --ignore \"**/*.test.*,**/*.spec.*\" src"

[routes]
extractor = "nextjs-app"
roots = ["src/app", "app"]

[client]
# fetch("/x"), fetch(`/x/${id}`), and common wrappers: api.get("/x")
patterns = [
  '''fetch\(\s*[`"'](?P<path>/[^`"'\s?#]*)''',
  '''\b(?:api|http|client)\.(?:get|post|put|patch|delete)\(\s*[`"'](?P<path>/[^`"'\s?#]*)''',
]
globs = ["src/**/*.ts", "src/**/*.tsx", "app/**/*.ts", "app/**/*.tsx"]
exclude = ["**/*.test.*", "**/*.spec.*", "**/route.ts", "src/server/**"]
prefix = "/"

[tables]
# Drizzle: pgTable("name", ...), also when the name is on the next line.
patterns = ['''\b(?:pg|mysql|sqlite)Table\(\s*[`"'](?P<name>[A-Za-z0-9_]+)[`"']''']
globs = ["src/**/*.ts", "db/**/*.ts", "drizzle/**/*.ts"]
exclude = ["**/*.test.*", "**/*.spec.*"]

[tests]
globs = ["**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "e2e/**"]
integration_globs = ["e2e/**", "tests/**", "**/*.int.test.ts", "**/*.int.test.tsx"]
# Real-stack proof is e2e (Playwright against `start`). Vitest "integration" tests run route
# handlers in-process under jsdom and never cross HTTP (the Hangout pilot's /v1 vs /api/v1).
real_stack = ["e2e"]
forbid = [
  { regex = '''readFileSync\([^)]*["'`][^"'`]*\b(?:src|app)/''', message = "test reads source text instead of exercising behaviour" },
  # helpers that wrap readFileSync: read("src/app/tokens.css")
  { regex = '''\bread(?!FileSync)\w*\(\s*["'`](?:\./)?(?:src|app)/''', message = "test reads source text instead of exercising behaviour" },
  { regex = '\.toMatch\(\s*/[^/]*(?:className|class=)', message = "test asserts on markup strings; assert on rendered behaviour" },
]

[scope]
always_allowed = ["package-lock.json", "pnpm-lock.yaml", "yarn.lock", "**/__snapshots__/**"]

[app]
ready_path = "/"
# Route handlers answer OPTIONS with an Allow header: probe writes without writing.
mutating_probe = "options"
