name: kit

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, gate and end-to-end conveyor tests
        working-directory: tests
        run: python -m unittest -v
      - name: Example product passes its own CI gate
        run: python -m sdlc --root examples/returns-app gate ci
